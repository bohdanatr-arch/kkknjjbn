<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTok Coin Claim - Pink Edition</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
      overflow: hidden;
    }

    /* Blue background (matches original video) */
    .blue-bg {
      background-color: #0099ff;
      background: radial-gradient(circle at 50% 30%, #00a4ff 0%, #0095f6 60%, #0080e5 100%);
    }

    /* Floating ambient clouds */
    .ambient-cloud {
      position: absolute;
      pointer-events: none;
      filter: drop-shadow(0 6px 14px rgba(255, 255, 255, 0.25));
      animation: floatCloud linear infinite;
    }

    @keyframes floatCloud {
      0% {
        transform: translateX(-160px);
      }
      100% {
        transform: translateX(105vw);
      }
    }

    /* Chest breathing and glow */
    @keyframes chestPulse {
      0%, 100% {
        transform: scale(1) translateY(0);
        filter: drop-shadow(0 10px 20px rgba(0, 140, 255, 0.45));
      }
      50% {
        transform: scale(1.05) translateY(-5px);
        filter: drop-shadow(0 15px 30px rgba(255, 215, 0, 0.8));
      }
    }
    .chest-animate {
      animation: chestPulse 2.8s ease-in-out infinite;
    }

    /* Spawning coins float */
    @keyframes floatBob {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-14px) rotate(6deg);
      }
    }
    .coin-float {
      animation: floatBob 2.2s ease-in-out infinite;
    }

    /* Incoming flying coin animation */
    @keyframes spinCoin {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(0.92, 1) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }
    .coin-spin {
      animation: spinCoin 2.4s linear infinite;
    }

    /* Chest catch flash effect */
    .chest-caught {
      transform: scale(1.22) !important;
      filter: drop-shadow(0 0 25px rgba(255, 230, 0, 1)) !important;
    }

    /* 3D Coin Style */
    .coin-gold {
      background: radial-gradient(circle at 35% 30%, #fff6a6 0%, #f7b731 45%, #c78100 85%, #8c5300 100%);
      box-shadow: 0 8px 18px rgba(140, 83, 0, 0.4), 
                  inset 0 2px 4px rgba(255, 255, 255, 0.8),
                  inset 0 -3px 6px rgba(0, 0, 0, 0.4);
      border: 3px solid #ffeaa7;
    }

    /* Shimmer effect for buttons */
    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 20%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0) 80%
      );
      transform: rotate(25deg);
      animation: shine 3s infinite;
    }
    @keyframes shine {
      0% { left: -70%; }
      30%, 100% { left: 140%; }
    }

    /* Number ticker animation */
    .pop-number {
      animation: popScale 0.25s ease-out;
    }
    @keyframes popScale {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); color: #facc15; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="blue-bg text-white min-h-screen flex items-center justify-center relative select-none">

  <!-- Ambient floating particles background -->
  <div id="ambient-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

  <!-- Audio Toggle Button (top right corner) -->
  <button id="soundToggle" class="absolute top-4 right-4 z-50 bg-black/30 hover:bg-black/50 backdrop-blur-md p-2.5 rounded-full border border-white/20 transition-all active:scale-95 text-white/90">
    <svg id="soundIconOn" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
    </svg>
    <svg id="soundIconOff" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
    </svg>
  </button>

  <!-- App Wrapper (Mobile Aspect ratio styled container) -->
  <div class="relative w-full max-w-md h-[100dvh] flex flex-col justify-between p-4 z-10 overflow-hidden">
    
    <!-- TOP SECTION: Navigation & Balance Card -->
    <div class="w-full pt-1 flex flex-col gap-3">
      
      <!-- Top Nav Header -->
      <div class="flex items-center justify-between text-white/95 px-1 py-1">
        <button class="p-1 rounded-full hover:bg-white/10 active:scale-95 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <span class="font-bold text-base tracking-wide flex items-center gap-1.5 drop-shadow-sm">
          <span>TikTok Coin Claim</span>
          <span class="text-[10px] bg-white/20 text-white font-semibold px-2 py-0.5 rounded-full uppercase tracking-wider">Live</span>
        </span>
        <div class="flex items-center gap-2">
          <button class="p-1 rounded-full hover:bg-white/10 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- TikTok Balance Card Image with dynamic Coins Row overlay -->
      <div id="targetBalanceCard" class="relative w-full rounded-2xl overflow-hidden shadow-2xl border border-white/20 select-none">
        <img 
          src="https://i.postimg.cc/ht3C0W26/magnific-48450.png" 
          alt="TikTok Balance Card" 
          class="w-full h-auto object-cover block pointer-events-none select-none" 
        />
        <!-- Dynamic row where collected coins line up on the card -->
        <div id="coinsRow" class="absolute left-5 right-5 top-[33%] h-9 flex items-center gap-1.5 pointer-events-none z-10 overflow-hidden">
          <!-- Filled dynamically by JavaScript -->
        </div>
        <!-- Live coin counter badge -->
        <div class="absolute top-2.5 right-3.5 z-10">
          <div class="bg-black/65 backdrop-blur-md px-3.5 py-1 rounded-full border border-white/15 shadow-md flex items-center justify-center">
            <span id="coinCountDisplay" class="font-black text-xl text-white tracking-tight leading-none">0</span>
          </div>
        </div>
      </div>

    </div>

    <!-- MIDDLE GAME PLAY AREA: Chest Catch & Flying Coins from Right -->
    <div id="gamePlayArea" class="relative flex-1 w-full overflow-hidden touch-none select-none rounded-3xl my-2 border border-white/10 bg-black/10 backdrop-blur-[2px]">
      
      <!-- Interactive drag instruction prompt -->
      <div id="dragPrompt" class="absolute top-3 inset-x-0 mx-auto w-fit text-center pointer-events-none z-10 transition-opacity duration-500">
        <span class="inline-flex items-center gap-1.5 bg-black/40 backdrop-blur-md px-3.5 py-1.5 rounded-full text-xs font-bold text-white/90 border border-white/20 shadow-md">
          <span>↕️</span> Рухайте скриньку вгору та вниз і ловіть монети!
        </span>
      </div>

      <!-- Vertical track guide for the chest -->
      <div class="absolute left-[66px] top-3 bottom-3 w-0.5 border-r border-dashed border-white/25 pointer-events-none z-10"></div>

      <!-- Container where coins fly from right side to left -->
      <div id="coinSpawnZone" class="absolute inset-0 pointer-events-none overflow-hidden">
        <!-- Flying coins dynamically handled here -->
      </div>

      <!-- Drag & Move Treasure Chest Container (Vertical Movement Only) -->
      <div id="chestContainer" class="absolute z-30 flex flex-col items-center cursor-ns-resize active:cursor-grabbing transition-transform duration-75 select-none" style="left: 18px; top: 120px; width: 100px; height: 95px;">
        <!-- Chest Graphic -->
        <div id="chestGraphic" class="w-24 h-24 relative pointer-events-none transition-transform duration-100 flex items-center justify-center">
          <img 
            src="https://i.postimg.cc/FzssmL0z/magnific-48449.png" 
            alt="Treasure Chest" 
            class="w-full h-full object-contain pointer-events-none select-none drop-shadow-[0_8px_20px_rgba(0,0,0,0.45)]"
          />
        </div>
      </div>

    </div>

    <!-- BOTTOM ACTION BUTTON: Withdraw Coins -->
    <div class="w-full pb-3 z-20">
      <button id="withdrawBtn" class="btn-shine w-full py-4 px-6 bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black text-lg rounded-2xl shadow-[0_10px_25px_rgba(251,191,36,0.55)] border-2 border-yellow-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <svg class="w-6 h-6 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
        <span class="tracking-wide">Withdraw Coins</span>
      </button>
      <div class="text-center mt-2 text-white/80 text-[11px] font-semibold">
        Мінімум для виводу: 10 монет • Швидка виплата
      </div>
    </div>

  </div>

  <!-- ================= MODAL 1: ENTER USERNAME ================= -->
  <div id="usernameModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
    <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl transform scale-95 transition-all duration-300 text-gray-800 relative">
      <!-- Close button -->
      <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <!-- TikTok Coin Icon in modal -->
      <div class="w-16 h-16 mx-auto mb-3 flex items-center justify-center">
        <img src="https://i.postimg.cc/mkg68Cn0/Zolotaa-moneta-Tik-Tok-so-zvezdoj.png" alt="TikTok Star Coin" class="w-full h-full object-contain drop-shadow-md" />
      </div>

      <h3 class="text-2xl font-black text-center text-gray-900 mb-1">Enter Username</h3>
      <p class="text-center text-gray-500 text-xs mb-5 font-medium">Enter your username to withdraw</p>

      <!-- Form -->
      <form id="withdrawForm" onsubmit="event.preventDefault(); handleProceed();">
        <div class="mb-5">
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">TikTok Username</label>
          <div class="relative flex items-center">
            <span class="absolute left-3.5 text-blue-500 font-bold text-lg select-none">@</span>
            <input 
              type="text" 
              id="usernameInput" 
              required
              placeholder="YourUsername" 
              class="w-full pl-9 pr-4 py-3.5 bg-gray-50 border-2 border-gray-200 focus:border-blue-500 focus:bg-white rounded-xl text-gray-900 font-semibold text-base outline-none transition-all shadow-inner"
              autocomplete="off"
            />
          </div>
          <div id="usernameError" class="text-xs text-rose-500 mt-1 hidden font-medium">Будь ласка, введіть дійсний нікнейм</div>
        </div>

        <button 
          type="submit" 
          id="proceedBtn" 
          class="w-full py-3.5 bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-900 font-black text-base rounded-xl shadow-lg shadow-cyan-500/30 active:scale-95 transition-all flex items-center justify-center gap-2"
        >
          <span id="proceedBtnText">Proceed</span>
          <div id="proceedSpinner" class="w-5 h-5 border-2 border-slate-900 border-t-transparent rounded-full animate-spin hidden"></div>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= MODAL 2: CONGRATULATIONS ================= -->
  <div id="successModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
    <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl transform scale-95 transition-all duration-300 text-center relative">
      <h3 class="text-3xl font-black text-gray-900 mb-1 tracking-tight">Congratulations!</h3>

      <!-- Animated Yellow Coin Counter -->
      <div class="my-3 py-2 px-4 inline-flex items-center justify-center gap-2.5 bg-amber-50/80 rounded-2xl border border-amber-200/80 shadow-inner">
        <div class="w-9 h-9 flex-shrink-0 animate-bounce">
          <img src="https://i.postimg.cc/mkg68Cn0/Zolotaa-moneta-Tik-Tok-so-zvezdoj.png" alt="TikTok Coin" class="w-full h-full object-contain drop-shadow" />
        </div>
        <div class="text-4xl sm:text-5xl font-black text-amber-400 drop-shadow-[0_2px_10px_rgba(251,191,36,0.55)] tracking-tight">
          +<span id="animatedYellowCounter">0</span>
        </div>
      </div>

      <p class="text-base text-gray-600 mb-6 font-medium px-2">
        <span id="successCoinsCount" class="font-black text-amber-500">0</span> coins sent to <span id="successUsername" class="font-extrabold text-gray-900">@user</span> successfully!
      </p>

      <button 
        id="tryAgainBtn" 
        class="w-full py-3.5 bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-900 font-black text-base rounded-xl active:scale-95 transition-all shadow-lg shadow-cyan-500/30"
      >
        Try Again
      </button>
    </div>
  </div>

  <!-- Toast Notification for small hints -->
  <div id="toast" class="fixed bottom-20 z-50 bg-black/80 backdrop-blur-md text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-200 transform translate-y-4">
    Зберіть мінімум 1 монету!
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* ================= Web Audio API Synthesis ================= */
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Play crisp coin ding sound
    function playCoinSound(frequencyMultiplier = 1) {
      if (isMuted) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        const now = audioCtx.currentTime;
        
        // Pentatonic bright coin frequencies
        const baseFreq = 987.77 * frequencyMultiplier; // B5
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.12);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      } catch (e) {
        // Audio error silent fallback
      }
    }

    // Play Fanfare / Celebration Sound
    function playCelebrationSound() {
      if (isMuted) return;
      try {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
          }, idx * 100);
        });
      } catch (e) {}
    }

    /* ================= Background Floating Clouds ================= */
    const ambientContainer = document.getElementById('ambient-container');
    function createAmbientClouds() {
      const cloudSvg = `
        <svg viewBox="0 0 100 55" fill="white" class="w-full h-full">
          <path d="M25 45h52a16 16 0 0 0 2-31.8A22 22 0 0 0 38 10a18 18 0 0 0-17 11.5A14 14 0 0 0 25 45z"/>
        </svg>
      `;
      for (let i = 0; i < 7; i++) {
        const cloud = document.createElement('div');
        cloud.className = 'ambient-cloud';
        const width = Math.random() * 65 + 75; // 75px - 140px
        cloud.style.width = `${width}px`;
        cloud.style.height = `${width * 0.55}px`;
        cloud.style.top = `${Math.random() * 82}%`;
        cloud.style.opacity = `${0.35 + Math.random() * 0.45}`;
        const duration = 20 + Math.random() * 18; // 20s - 38s
        cloud.style.animationDuration = `${duration}s`;
        cloud.style.animationDelay = `-${Math.random() * duration}s`; // Start across the screen immediately
        cloud.innerHTML = cloudSvg;
        ambientContainer.appendChild(cloud);
      }
    }
    createAmbientClouds();

    /* ================= Game State ================= */
    let coinCount = 0;
    const maxDisplayedMiniCoins = 8;
    const COIN_IMG_URL = 'https://i.postimg.cc/mkg68Cn0/Zolotaa-moneta-Tik-Tok-so-zvezdoj.png';
    const gamePlayArea = document.getElementById('gamePlayArea');
    const coinSpawnZone = document.getElementById('coinSpawnZone');
    const coinsRow = document.getElementById('coinsRow');
    const coinCountDisplay = document.getElementById('coinCountDisplay');
    const emptyCoinPlaceholder = document.getElementById('emptyCoinPlaceholder');
    const chestContainer = document.getElementById('chestContainer');
    const chestGraphic = document.getElementById('chestGraphic');
    const targetBalanceCard = document.getElementById('targetBalanceCard');
    const dragPrompt = document.getElementById('dragPrompt');

    // Mute/Unmute toggle
    const soundToggle = document.getElementById('soundToggle');
    const soundIconOn = document.getElementById('soundIconOn');
    const soundIconOff = document.getElementById('soundIconOff');

    soundToggle.addEventListener('click', () => {
      isMuted = !isMuted;
      if (isMuted) {
        soundIconOn.classList.add('hidden');
        soundIconOff.classList.remove('hidden');
      } else {
        soundIconOn.classList.remove('hidden');
        soundIconOff.classList.add('hidden');
        initAudio();
      }
    });

    /* ================= Chest Dragging System (Vertical Only) ================= */
    let isDragging = false;
    const CHEST_FIXED_X = 18; // Fixed horizontally on the left side
    let chestPos = { x: CHEST_FIXED_X, y: 150 };
    let dragOffsetY = 0;
    const chestSize = { width: 96, height: 92 };

    function initChestPosition() {
      const rect = gamePlayArea.getBoundingClientRect();
      chestPos.x = CHEST_FIXED_X;
      chestPos.y = rect.height / 2 - chestSize.height / 2;
      updateChestDOM();
    }

    function updateChestDOM() {
      chestContainer.style.left = `${chestPos.x}px`;
      chestContainer.style.top = `${chestPos.y}px`;
    }

    // Move chest strictly UP & DOWN along vertical axis
    function handlePointerStart(e) {
      initAudio();
      isDragging = true;
      const rect = gamePlayArea.getBoundingClientRect();
      const pointerY = e.clientY - rect.top;

      dragOffsetY = pointerY - chestPos.y;

      // If clicked anywhere in the field, chest aligns vertically to finger
      if (Math.abs(pointerY - (chestPos.y + chestSize.height / 2)) > 50) {
        dragOffsetY = chestSize.height / 2;
        moveChestToY(pointerY - dragOffsetY, rect);
      }

      if (dragPrompt) {
        dragPrompt.style.opacity = '0';
      }
    }

    function handlePointerMove(e) {
      if (!isDragging) return;
      const rect = gamePlayArea.getBoundingClientRect();
      const targetY = e.clientY - rect.top - dragOffsetY;
      moveChestToY(targetY, rect);
    }

    function moveChestToY(y, rect) {
      const maxY = rect.height - chestSize.height;
      chestPos.y = Math.max(0, Math.min(y, maxY));
      chestPos.x = CHEST_FIXED_X;
      updateChestDOM();
    }

    function handlePointerEnd() {
      isDragging = false;
    }

    gamePlayArea.addEventListener('pointerdown', handlePointerStart);
    window.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerEnd);
    window.addEventListener('pointercancel', handlePointerEnd);

    /* ================= Flying Coins & Collision Loop ================= */
    let activeCoins = [];
    let lastSpawnTime = 0;
    const spawnInterval = 1100; // New coin every 1.1s

    function createIncomingCoin() {
      const areaRect = gamePlayArea.getBoundingClientRect();
      const coinEl = document.createElement('div');
      coinEl.className = 'absolute select-none pointer-events-none z-20';
      
      const startX = areaRect.width + 10;
      // Random Y within play boundaries
      const startY = Math.random() * (areaRect.height - 76) + 10;
      const speed = 150 + Math.random() * 85; // Speed in pixels per second

      coinEl.innerHTML = `
        <div class="w-14 h-14 relative drop-shadow-[0_6px_14px_rgba(0,0,0,0.4)] coin-spin flex items-center justify-center">
          <img src="${COIN_IMG_URL}" alt="TikTok Star Coin" class="w-full h-full object-contain pointer-events-none select-none drop-shadow-md" />
        </div>
      `;

      coinSpawnZone.appendChild(coinEl);

      return {
        el: coinEl,
        x: startX,
        y: startY,
        width: 56,
        height: 56,
        speed: speed,
        caught: false
      };
    }

    let lastFrameTime = performance.now();

    function gameLoop(now) {
      const dt = (now - lastFrameTime) / 1000;
      lastFrameTime = now;

      // Spawn coins regularly
      if (now - lastSpawnTime > spawnInterval) {
        lastSpawnTime = now;
        activeCoins.push(createIncomingCoin());
      }

      // Current chest hitbox bounds
      const chestHitbox = {
        x: chestPos.x + 10,
        y: chestPos.y + 10,
        width: chestSize.width - 20,
        height: chestSize.height - 15
      };

      // Update positions & check collisions
      for (let i = activeCoins.length - 1; i >= 0; i--) {
        const coin = activeCoins[i];

        if (coin.caught) continue;

        // Move coin from right to left
        coin.x -= coin.speed * dt;
        coin.el.style.transform = `translate3d(${coin.x}px, ${coin.y}px, 0)`;

        // Collision Check: AABB with chest
        const isColliding = (
          coin.x < chestHitbox.x + chestHitbox.width &&
          coin.x + coin.width > chestHitbox.x &&
          coin.y < chestHitbox.y + chestHitbox.height &&
          coin.y + coin.height > chestHitbox.y
        );

        if (isColliding) {
          coin.caught = true;
          catchCoin(coin);
          activeCoins.splice(i, 1);
          continue;
        }

        // Out of screen left
        if (coin.x < -70) {
          coin.el.remove();
          activeCoins.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // Triggered when chest touches a flying coin
    function catchCoin(coin) {
      playCoinSound(1 + (coinCount % 6) * 0.1);

      // Chest squash/stretch feedback
      chestGraphic.classList.add('chest-caught');
      setTimeout(() => chestGraphic.classList.remove('chest-caught'), 180);

      // Coordinates for flight up to TikTok balance card
      const coinRect = coin.el.getBoundingClientRect();
      const cardRect = targetBalanceCard.getBoundingClientRect();

      const endX = cardRect.left + 28 + Math.min(coinCount * 28, cardRect.width - 60);
      const endY = cardRect.top + cardRect.height * 0.38;

      // Create a flying clone that shoots up into the card
      const flyer = document.createElement('div');
      flyer.className = 'fixed z-50 pointer-events-none';
      flyer.style.left = `${coinRect.left}px`;
      flyer.style.top = `${coinRect.top}px`;
      flyer.style.margin = '0';
      flyer.style.transition = 'all 0.55s cubic-bezier(0.16, 1, 0.3, 1)';
      
      flyer.innerHTML = `
        <div class="w-12 h-12 flex items-center justify-center">
          <img src="${COIN_IMG_URL}" class="w-full h-full object-contain drop-shadow-lg" alt="coin" />
        </div>
      `;
      document.body.appendChild(flyer);

      // Remove the original coin DOM
      coin.el.remove();

      // Launch to card
      requestAnimationFrame(() => {
        flyer.style.left = `${endX}px`;
        flyer.style.top = `${endY}px`;
        flyer.style.transform = 'scale(0.5) rotate(360deg)';
        flyer.style.opacity = '0.9';
      });

      // Show +10 floating prompt
      showPlusTen(chestPos.x + 40, chestPos.y - 10);

      setTimeout(() => {
        flyer.remove();
        incrementCoins();
      }, 550);
    }

    // Floating "+10" label on catch
    function showPlusTen(x, y) {
      const areaRect = gamePlayArea.getBoundingClientRect();
      const tag = document.createElement('div');
      tag.className = 'fixed font-black text-amber-300 text-xl pointer-events-none z-50 transition-all duration-700 ease-out drop-shadow-[0_2px_6px_rgba(0,0,0,0.7)]';
      tag.innerText = '+10 🪙';
      tag.style.left = `${areaRect.left + x}px`;
      tag.style.top = `${areaRect.top + y}px`;
      document.body.appendChild(tag);

      requestAnimationFrame(() => {
        tag.style.transform = 'translateY(-35px) scale(1.35)';
        tag.style.opacity = '0';
      });

      setTimeout(() => tag.remove(), 700);
    }

    // Update state and UI
    function incrementCoins() {
      coinCount += 10;

      // Update counter text with pop animation
      coinCountDisplay.innerText = coinCount;
      coinCountDisplay.classList.remove('pop-number');
      void coinCountDisplay.offsetWidth; // trigger reflow
      coinCountDisplay.classList.add('pop-number');

      // Add a mini golden coin into the balance card row (video behavior)
      if (coinsRow.children.length < maxDisplayedMiniCoins) {
        const mini = document.createElement('div');
        mini.className = 'w-7 h-7 flex-shrink-0 flex items-center justify-center transform scale-0 transition-transform duration-300 drop-shadow-md';
        mini.innerHTML = `<img src="${COIN_IMG_URL}" class="w-full h-full object-contain pointer-events-none" alt="coin" />`;
        coinsRow.appendChild(mini);
        setTimeout(() => mini.classList.remove('scale-0'), 10);
      }
    }

    // Initialize chest positioning and start loop on load
    window.addEventListener('load', () => {
      initChestPosition();
      requestAnimationFrame((t) => {
        lastFrameTime = t;
        lastSpawnTime = t;
        gameLoop(t);
      });
    });

    window.addEventListener('resize', () => {
      initChestPosition();
    });

    /* ================= Withdraw & Modals Logic ================= */
    const withdrawBtn = document.getElementById('withdrawBtn');
    const usernameModal = document.getElementById('usernameModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const usernameInput = document.getElementById('usernameInput');
    const usernameError = document.getElementById('usernameError');
    const proceedBtn = document.getElementById('proceedBtn');
    const proceedBtnText = document.getElementById('proceedBtnText');
    const proceedSpinner = document.getElementById('proceedSpinner');
    const successModal = document.getElementById('successModal');
    const successCoinsCount = document.getElementById('successCoinsCount');
    const animatedYellowCounter = document.getElementById('animatedYellowCounter');
    const successUsername = document.getElementById('successUsername');
    const tryAgainBtn = document.getElementById('tryAgainBtn');
    const toast = document.getElementById('toast');

    // Animated counting for collected coins in modal
    function animateYellowCounter(targetValue) {
      if (!animatedYellowCounter) return;
      animatedYellowCounter.innerText = '0';
      const duration = 1200; // ms
      const startTime = performance.now();
      let lastStep = -1;

      function updateTicker(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const currentVal = Math.round((easeOut * targetValue) / 10) * 10;
        const displayVal = Math.min(targetValue, Math.max(0, currentVal));

        animatedYellowCounter.innerText = displayVal;

        if (displayVal !== lastStep && displayVal > 0) {
          lastStep = displayVal;
          playCoinSound(1.1 + (displayVal / (targetValue || 1)) * 0.4);
        }

        if (progress < 1) {
          requestAnimationFrame(updateTicker);
        } else {
          animatedYellowCounter.innerText = targetValue;
        }
      }

      requestAnimationFrame(updateTicker);
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
      }, 2200);
    }

    // Open Username Modal
    withdrawBtn.addEventListener('click', () => {
      initAudio();
      if (coinCount === 0) {
        showToast('Спочатку наловіть монети скринькою!');
        return;
      }
      usernameModal.classList.remove('opacity-0', 'pointer-events-none');
      usernameModal.querySelector('div').classList.remove('scale-95');
      usernameInput.focus();
    });

    // Close Modal
    closeModalBtn.addEventListener('click', () => {
      usernameModal.classList.add('opacity-0', 'pointer-events-none');
      usernameModal.querySelector('div').classList.add('scale-95');
      usernameError.classList.add('hidden');
    });

    // Handle Proceed
    window.handleProceed = function() {
      const val = usernameInput.value.trim().replace(/^@/, '');
      if (!val) {
        usernameError.classList.remove('hidden');
        return;
      }
      usernameError.classList.add('hidden');

      // Show loading state
      proceedBtn.disabled = true;
      proceedBtnText.innerText = 'Connecting...';
      proceedSpinner.classList.remove('hidden');

      setTimeout(() => {
        // Success state
        proceedBtn.disabled = false;
        proceedBtnText.innerText = 'Proceed';
        proceedSpinner.classList.add('hidden');

        // Hide username modal
        usernameModal.classList.add('opacity-0', 'pointer-events-none');
        usernameModal.querySelector('div').classList.add('scale-95');

        // Setup success modal
        successCoinsCount.innerText = coinCount;
        successUsername.innerText = `@${val}`;

        // Show success modal
        successModal.classList.remove('opacity-0', 'pointer-events-none');
        successModal.querySelector('div').classList.remove('scale-95');

        // Start counting animation for the yellow counter
        animateYellowCounter(coinCount);

        // Sounds & Confetti!
        playCelebrationSound();
        try {
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#00b4f0', '#0072db', '#ffd32a', '#ffffff', '#22c55e']
          });
        } catch (e) {}

      }, 1200);
    };

    // Try Again / Reset
    tryAgainBtn.addEventListener('click', () => {
      successModal.classList.add('opacity-0', 'pointer-events-none');
      successModal.querySelector('div').classList.add('scale-95');

      // Reset coins
      coinCount = 0;
      coinCountDisplay.innerText = '0';
      coinsRow.innerHTML = '';
      usernameInput.value = '';
      if (animatedYellowCounter) animatedYellowCounter.innerText = '0';

      // Clear flying coins and reset
      activeCoins.forEach(c => c.el.remove());
      activeCoins = [];
      initChestPosition();
    });

    // First interaction unlocks AudioContext for mobile browsers
    document.addEventListener('pointerdown', () => {
      initAudio();
    }, { once: true });
  </script>
</body>
</html>
